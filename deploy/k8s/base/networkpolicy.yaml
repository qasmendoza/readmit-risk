# Default-deny ingress for the namespace, then allow only the API port, and only from
# namespaces explicitly labelled readmit.io/allow-ingress=true (e.g. the ingress controller
# and Prometheus). Enforcement requires a CNI that supports NetworkPolicy (Calico, Cilium, ...).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              readmit.io/allow-ingress: "true"
      ports:
        - protocol: TCP
          port: 8080
