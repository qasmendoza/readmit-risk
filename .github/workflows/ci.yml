name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "$(grep '^ruff==' constraints.txt)"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: constraints.txt
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: pytest -m "not spark" --cov=readmit --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  spark:
    name: PySpark parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: constraints.txt
      - run: pip install -c constraints.txt -e ".[dev,spark]"
      - run: pytest -m spark

  pipeline:
    name: Train, quality gate, and drift demo
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: constraints.txt
      - run: pip install -c constraints.txt -e ".[dev]"
      - name: Train and evaluate (fails the job if the quality gate fails)
        run: readmit run --synthetic --patients 2000 --no-tracking
      - name: Drift monitoring on a simulated shifted population
        run: |
          readmit synth --patients 800 --drift --out data/fhir_drifted
          readmit monitor --input data/fhir_drifted --output reports/monitoring
      - uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports/

  docker:
    name: Container build and smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: readmit-risk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id readmit-risk:ci -u)" = "10001"
      - name: Smoke test the default (Kubernetes) command
        run: |
          docker run -d --name api -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL readmit-risk:ci
          bash scripts/smoke_test.sh http://localhost:8080
          docker rm -f api
      - name: Smoke test the SageMaker entrypoint (`docker run <image> serve`)
        run: |
          docker run -d --name sagemaker -p 8081:8080 --read-only --tmpfs /tmp readmit-risk:ci serve
          bash scripts/smoke_test.sh http://localhost:8081
          docker rm -f sagemaker

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.0/kustomize_v5.8.0_linux_amd64.tar.gz" | tar xz -C "$RUNNER_TEMP/bin" kustomize
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz" | tar xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Render and validate overlays
        run: |
          for overlay in dev prod; do
            kustomize build "deploy/k8s/overlays/$overlay" | kubeconform -strict -summary -
          done
