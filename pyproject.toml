[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readmit"
version = "0.1.0"
description = "FHIR-native 30-day hospital readmission risk prediction with production MLOps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Querriel Arvy Mendoza", email = "qasmendoza@gmail.com" }]
keywords = ["healthcare", "fhir", "readmission", "mlops", "clinical-ml", "fastapi", "mlflow", "kubernetes"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.6",
  "statsmodels>=0.14",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "pyarrow>=15",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "prometheus-client>=0.20"]
track = ["mlflow>=3.0"]
viz = ["matplotlib>=3.8"]
llm = ["anthropic>=0.40"]
spark = ["pyspark>=3.5"]
aws = ["boto3>=1.34"]
dev = [
  "readmit[serve,track,viz]",
  "httpx>=0.27",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[project.urls]
Repository = "https://github.com/qasmendoza/readmit-risk"

[project.scripts]
readmit = "readmit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["mlruns", "artifacts", "reports", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # line length is enforced by `ruff format`

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Query", "fastapi.Header", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "spark: requires pyspark and a Java runtime",
  "slow: end-to-end tests that take several seconds",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
  "ignore::ResourceWarning",
  "ignore::UserWarning:mlflow.*",
]

[tool.coverage.run]
source = ["readmit"]
omit = ["*/readmit/fhir/spark_flatten.py"]  # exercised by the dedicated Spark CI job

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
